version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cambiobot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cambiobot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cambiobot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cambiobot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cambiobot-network

  # Evolution API (WhatsApp)
  evolution-api:
    image: atendai/evolution-api:v1.8.0
    container_name: cambiobot-evolution
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-cambiobot-secret-key}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution?schema=public
      - REDIS_URI=redis://redis:6379
      - LOG_LEVEL=INFO
      - CONFIG_SESSION_PHONE_CLIENT=CambioBot
      - CONFIG_SESSION_PHONE_NAME=CambioBot
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - cambiobot-network

  # n8n (Workflow Orchestration)
  n8n:
    image: n8nio/n8n:latest
    container_name: cambiobot-n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-cambiobot123}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - EXECUTIONS_MODE=regular
      - N8N_RUNNERS_ENABLED=true
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cambiobot-network

  # CambioBot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cambiobot-api
    command: ["python", "-m", "cambiobot.api.main"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cambiobot
      - REDIS_URL=redis://redis:6379/0
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-cambiobot-secret-key}
      - EVOLUTION_INSTANCE_NAME=cambiobot
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=openrouter
      - DEEP_THINK_LLM=anthropic/claude-3.5-sonnet
      - QUICK_THINK_LLM=openai/gpt-4o-mini
      - TEMPERATURE=0.1
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    volumes:
      - ./:/app
      - ./logs:/app/logs
    networks:
      - cambiobot-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: cambiobot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cambiobot-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cambiobot-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-cambiobot123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cambiobot-network

  # LangFuse (LLM Observability) - Optional, requires separate setup
  # langfuse:
  #   image: langfuse/langfuse:2
  #   container_name: cambiobot-langfuse
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
  #     - REDIS_URL=redis://redis:6379
  #     - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}
  #     - SALT=${LANGFUSE_SALT}
  #   ports:
  #     - "3001:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - cambiobot-network

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  n8n_data:
  prometheus_data:
  grafana_data:

networks:
  cambiobot-network:
    driver: bridge