[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cambiobot"
version = "0.1.0"
description = "CambioBot - Agente Inteligente de Otimização Cambial para Viajantes via WhatsApp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=4.0.0",
    "langgraph>=0.4.8",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "redis>=6.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "yfinance>=1.4.1",
    "pandas>=2.3.0",
    "requests>=2.32.4",
    "httpx>=0.28.0",
    "tenacity>=8.5.0",
    "structlog>=25.1.0",
    "prometheus-client>=0.21.0",
    "typer>=0.21.0",
    "rich>=14.0.0",
    "questionary>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "pre-commit>=3.8.0",
]
tradingagents = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@main",
    "backtrader>=1.9.78.123",
    "langchain-experimental>=0.3.4",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
]
bedrock = [
    "langchain-aws>=1.5.0",
]
ollama = [
    "ollama>=0.5.0",
]

[project.scripts]
cambiobot = "cambiobot.cli:app"
cambiobot-api = "cambiobot.api:run"
cambiobot-worker = "cambiobot.worker:run"

[tool.setuptools.packages.find]
include = ["cambiobot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -v"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
    "e2e: end-to-end tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["results", ".tradingagents", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = ["E501", "ARG001", "ARG002", "PLW0511"]
preview = true

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cambiobot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["cambiobot"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]